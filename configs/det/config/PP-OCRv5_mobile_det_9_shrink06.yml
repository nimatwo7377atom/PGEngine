Global:
  model_name: PP-OCRv5_mobile_det_9 # To use static model for inference.
  debug: false
  use_gpu: true
  epoch_num: &epoch_num 30
  log_smooth_window: 5
  print_batch_step: 100
  save_model_dir: ./output/PP-OCRv5_mobile_det_9
  save_epoch_step: 10
  eval_batch_step:
  - 0
  - 93                       # once per epoch (93 train iters at batch 8)
  cal_metric_during_train: false
  checkpoints:
  # start from the converged v3 plate detector, not ImageNet: only the
  # boundary geometry of the target changes, the plate features do not.
  pretrained_model: /content/PGEngine/pretrained/PP-OCRv5_mobile_det_pretrained.pdparams
  save_inference_dir: ./inference_model/inference
  use_visualdl: false
  infer_img: doc/imgs_en/img_10.jpg
  save_res_path: ./checkpoints/det_db/predicts_db.txt
  d2s_train_image_shape: [3, 960, 960]
  distributed: true

Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.75
    det: True
  Neck:
    name: RSEFPN
    out_channels: 96
    shortcut: True
  Head:
    name: DBHead
    k: 50
    fix_nan: True

Loss:
  name: DBLoss
  balance_loss: true
  main_loss_type: DiceLoss
  alpha: 5
  beta: 10
  ohem_ratio: 3

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001 #(8*8c)
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 5.0e-05

PostProcess:
  name: DBPostProcess
  thresh: 0.3
  box_thresh: 0.7
  max_candidates: 1000
  # shrink_ratio 0.6 removes D = A*(1-0.6^2)/L per side instead of
  # A*(1-0.4^2)/L, so the expansion that undoes it is much smaller.
  # 0.95 is the optimum measured on the 11 hand-labelled plates
  # (_ceiling.py, r=0.6 sweep). Re-run calibrate_expansion.py against the
  # exported model before shipping this number.
  unclip_ratio: 1.5

Metric:
  name: DetMetric
  main_indicator: hmean

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /content/my_dataset/
    label_file_list:
      - /content/my_dataset/train.txt
    ratio_list: [1.0]
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - CopyPaste: null
    - IaaAugment:
        augmenter_args:
        - type: Fliplr
          args:
            p: 0.5
        - type: Affine
          args:
            rotate:
            - -20
            - 20
        - type: Resize
          args:
            size:
            - 0.5
            - 3
    - EastRandomCropData:
        size:
        - 768
        - 768
        max_tries: 50
        keep_ratio: true
    - MakeBorderMap:
        shrink_ratio: 0.6
        thresh_min: 0.3
        thresh_max: 0.7
        total_epoch: *epoch_num
    - MakeShrinkMap:
        shrink_ratio: 0.6
        min_text_size: 4
        total_epoch: *epoch_num
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - threshold_map
        - threshold_mask
        - shrink_map
        - shrink_mask
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 8
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /content/my_dataset/
    label_file_list:
      # v3 pointed this at train.txt, so its hmean=0.9608 and its
      # best_accuracy checkpoint were both chosen on training data.
      - /content/my_dataset/train.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - DetResizeForTest: 
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - shape
        - polys
        - ignore_tags
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 2
profiler_options: null
